<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link rel="stylesheet" href="/board/detail.css">
</head>
<body>
<div class="detail-container">
    <div class="detail-header">
        <h1 th:text="${post.title}">제목</h1>
        <div class="detail-meta">
            <div class="author-info">
                <span th:text="${post.author.username}">작성자</span>
            </div>
            <span th:text="${#temporals.format(post.createAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
        </div>
    </div>
    <div class="detail-content">
        <p th:text="${post.content}">내용</p>
    </div>
    <div class="btn-group">
        <a href="/board/list">목록으로</a>
        <a th:href="@{/board/update/{id}(id=${post.id})}">수정</a>
        <a th:href="@{/board/delete/{id}(id=${post.id})}" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
    </div>
</div>

<div class="comment-container">
    <h3>댓글 작성</h3>
    <div th:if="${loggedInUser != null}">
        <form th:action="@{/board/detail/{id}(id=${post.id})}" method="post">
            <input type="hidden" name="postId" th:value="${post.id}">
            <textarea name="content" placeholder="댓글을 입력하세요" required></textarea>
            <button type="submit">댓글 달기</button>
        </form>
    </div>
    <div id="check" th:if="${loggedInUser == null}">
        <p>댓글 달기는 로그인이 필요합니다. <a href="/user/login">로그인</a></p>
    </div>
</div>

<div class="comment-container">
    <h3>댓글 <span th:text="${count}"></span>개</h3>
    <ul class="comment-list">
        <li th:each="comment : ${comments}" class="comment">
            <div class="comment-header">
                <strong th:text="${comment.author.username}">작성자</strong>
                <small th:text="${#temporals.format(comment.createdDate, 'yy-MM-dd HH:mm')}">날짜</small>
            </div>
            <p th:text="${comment.content}">댓글 내용</p>
            <div class="comment-actions">
                <a th:if="${loggedInUser != null and comment.author.id == loggedInUser.id}"
                   th:href="@{/comments/update/{id}(id=${comment.id})}">수정</a>
                <a th:if="${loggedInUser != null and (comment.author.id == loggedInUser.id or loggedInUser.isAdmin())}"
                   th:href="@{/comments/delete/{id}(id=${comment.id})}"
                   onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                <a th:if="${loggedInUser != null}" href="#" onclick="toggleReplyForm(this)">답글</a>
            </div>
            <div class="reply-form" style="display: none;">
                <form th:action="@{/comments/reply}" method="post">
                    <input type="hidden" name="boardId" th:value="${post.id}">
                    <input type="hidden" name="commentId" th:value="${comment.id}">
                    <textarea name="content" placeholder="답글을 입력하세요" required></textarea>
                    <button type="submit">답글 달기</button>
                </form>
            </div>
            <ul th:if="${#lists.size(comment.replies) > 0}" class="replies">
                <li th:each="reply : ${comment.replies}" class="reply">
                    <div class="comment-header">
                        <strong th:text="${reply.author.username}">대댓글 작성자</strong>
                        <small th:text="${#temporals.format(reply.createdDate, 'yy-MM-dd HH:mm')}">날짜</small>
                    </div>
                    <p th:text="${reply.content}">대댓글 내용</p>
                    <div class="comment-actions">
                        <a th:if="${loggedInUser != null and reply.author.id == loggedInUser.id}"
                           th:href="@{/comments/update/{id}(id=${reply.id})}">수정</a>
                        <a th:if="${loggedInUser != null and (reply.author.id == loggedInUser.id or loggedInUser.isAdmin())}"
                           th:href="@{/comments/delete/{id}(id=${reply.id})}"
                           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                    </div>
                </li>
            </ul>
        </li>
    </ul>
</div>

<script>
    function toggleReplyForm(element) {
        document.querySelectorAll(".reply-form").forEach(form => form.style.display = "none");
        let replyForm = element.parentNode.nextElementSibling;
        replyForm.style.display = replyForm.style.display === "none" ? "block" : "none";
    }
</script>
</body>
</html>
