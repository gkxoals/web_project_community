<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <link rel="stylesheet" href="/board/style2.css">
</head>
<body>
<h1>게시글 수정</h1>
<form th:action="@{/board/update/{id}(id=${post.id})}" method="post">
    <label for="title">제목:</label>
    <input type="text" id="title" name="title" th:value="${post.title}" required>
    <br>
    <label for="content">내용: </label>
    <textarea id="content" name="content" required th:text="${post.content}"></textarea>
    <br>
    <button type="submit">수정</button>
    <a th:href="@{/board/detail/{id}(id=${post.id})}">취소</a>
</form>
</body>
</html>
